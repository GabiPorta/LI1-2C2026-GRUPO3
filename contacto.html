<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body class="body">
    <header class="navbar">
            <h1 class="logo">🌊 Bahia Esmeralda</h1>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="ciudad.html">Ciudad</a></li>
                    <li><a href="lugares.html">Lugares</a></li>
                    <li><a href="habitaciones.html">Habitaciones</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
        </header>
    <main>
      <div>
        <form id="form-contacto" class="formulario form-field" novalidate>
          <h3 class="h3">Contactanos</h3>
          <p class="p">¿Tienes alguna pregunta? ¡Contáctanos!</p>
          <div>
            <a href="Tel: +54 299 555-0187" class="link-contacto "><strong>Llamanos!</strong></a>
          </div>
          <div>
            <a href="mailto: contacto@bahiaesmeralda.com.ar" class="link-contacto"><strong>Envíanos un correo!</strong></a>
          </div>
          <h3 class="h3">Acercate a Avenida Costanera 1250, esquina Calle Gaviotas. (9.00hs a 18.00hs)</h3>
          <div class="formulario-box">
            <label for="nombre"><strong>Escribe tu nombre</strong></label>
          <input type="text" id="nombre" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label for="correo"><strong>Escribe tu correo</strong></label>
          <input type="email" id="correo" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label for="telefono"><strong>Escribe tu teléfono</strong></label>
          <input type="tel" id="telefono" class="box-input-contacto" />
          </div>
          <div class="col-12">
            <div class="formulario-box">
            <label class="label-formulario" for="mensaje"><strong>Escribe tu mensaje</strong></label>
          <textarea id="mensaje" cols="40" rows="5" class="mensaje"></textarea>
          <input type="submit" value="Enviar" class="submit-formulario" />
          <p id="estado"> </p>
          </div>
          </div>
        </form>
      </div>
    </main>
    <footer class="footer">
      <h2 class="h2">Nuestras Redes Sociales</h2>
      <a class="link-footer" href="https://www.esmeraldasocial.com/bahiaesmeralda" target="_blank"
        >Esmeralda Social</a
      >
    </footer>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
<script src="contacto.js"></script>

</html>
