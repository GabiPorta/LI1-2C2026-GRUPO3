  <body class="body">
    <header>
      <nav class="navbar md:navbar-expand mi-barra-personalizada bg-1 fg-2">
        <div class="container-fluid">
          <a class="navbar-brand" href="index.html">🌊 Bahía Esmeralda</a>

            type="button"

            data-bs-target="#navbarTogglerDemo01"

            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon" aria-hidden="true"></span>
          </button>
          <dialog
            class="drawer drawer-end"
            tabindex="-1"
            id="navbarTogglerDemo01"
            aria-labelledby="navbarTogglerDemo01Label"
          >
            <div class="drawer-header">
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="drawer"
                aria-label="Close"
              ></button>
            </div>
            <div class="drawer-body">
              <ul class="navbar-nav ms-auto mb-2 md:mb-0">
                <!--Cambie el "me-auto" por "ms-auto" despues de eliminar el formuario de buqueda para acomodar el menu hacia la derecha-->
                <!--"ms-auto" lo utilice para pasar el menu todo hacia la derecha, ocupando el lugar del buscador -->

                </li>
              </ul>
            </div>
          </dialog>
        </div>
      </nav>
    </header>
    <main>
      <div>
        <form id="form-contacto" class="formulario form-field" novalidate>
          <h1 class="h1">Contactanos</h1>
          <p class="p">¿Tienes alguna pregunta? ¡Contáctanos!</p>
          <div>
            <a
              href="Tel: +54 299 555-0187"
              class="link-contacto"
              rel="noopener noreferrer"
              ><strong>Llamanos!</strong></a
            >
          </div>
          <div>
            <a
              href="mailto: contacto@bahiaesmeralda.com.ar"
              class="link-contacto"
              rel="noopener noreferrer"
              ><strong>Envíanos un correo!</strong></a
            >
          </div>
          <h3 class="h3">
            Acercate a Avenida Costanera 1250, esquina Calle Gaviotas. (9.00hs a
            18.00hs)
          </h3>
          <div class="formulario-box">
            <label for="nombre"><strong>Escribe tu nombre</strong></label>
            <input type="text" id="nombre" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label for="correo"><strong>Escribe tu correo</strong></label>
            <input type="email" id="correo" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label for="telefono"><strong>Escribe tu teléfono</strong></label>
            <input type="tel" id="telefono" class="box-input-contacto" />
          </div>
          <div class="col-12">
            <div class="formulario-box">
              <label class="label-formulario" for="mensaje"
                ><strong>Escribe tu mensaje</strong></label
              >
              <textarea
                id="mensaje"
                cols="40"
                rows="5"
                class="mensaje"
              ></textarea>
              <input type="submit" value="Enviar" class="submit-formulario" />
              <p id="estado"></p>
            </div>
          </div>
        </form>
      </div>
    </main>
    <footer class="footer">
      <h2 class="h2">Nuestras Redes Sociales</h2>
      <a
        class="link-footer"
        href="https://www.esmeraldasocial.com/bahiaesmeralda"
        target="_blank"
        rel="noopener noreferrer"
      >
        Esmeralda Social
      </a>
    </footer>
    <script
      type="module"

      crossorigin="anonymous"
    ></script>
