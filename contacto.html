<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body class="body-contacto">
    <header class="header-contacto">
      <h1 class="h1-contacto">Bahía Esmeralda</h1>
      <h2 class="h2-contacto">"Donde el mar se encuentra con la aventura"</h2>
      <nav>
        <ul>
          <li><a class="link-body-contacto" href="index.html">Inicio</a></li>
          <li><a class="link-body-contacto" href="ciudad.html">Ciudad</a></li>
          <li><a class="link-body-contacto" href="lugares.html">Lugares</a></li>
          <li><a class="link-body-contacto" href="habitaciones.html">Habitaciones</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div>
        <form>
          <h3 class="h3-contacto">Contactanos</h3>
          <p class="p-contacto">¿Tienes alguna pregunta? ¡Contáctanos!</p>
          <p class="p-contacto"><strong>Teléfono: </strong>+54 299 555-0187</p>
          <p class="p-contacto">
            <strong>Correo Electrónico: </strong>contacto@bahiaesmeralda.com.ar
          </p>
          <label for="nombre">Escribe tu nombre</label>
          <input type="text" id="nombre" class="box" />
          <label for="correo">Escribe tu correo</label>
          <input type="email" id="correo" class="box" />
          <label for="mensaje">Escribe tu mensaje</label>
          <textarea id="mensaje" cols="40" rows="5"></textarea>
          <input type="submit" value="Enviar" class="submit" />
        </form>
      </div>
    </main>
    <footer class="footer-contacto">
      <h2 class="h2-contacto">Nuestras Redes Sociales</h2>
      <a class="link-footer-contacto" href="https://www.esmeraldasocial.com/bahiaesmeralda" target="_blank"
        >Esmeralda Social</a
      >
    </footer>
  </body>
