<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/estilos.css" />
  </head>
  <body class="body-contacto">
    <header class="header-contacto">
      <h1 class="h1-contacto">Bahía Esmeralda</h1>
      <h2 class="h2-contacto">"Donde el mar se encuentra con la aventura"</h2>
      <nav>
        <ul>
          <li><a class="link-body-contacto" href="index.html">Inicio</a></li>
          <li><a class="link-body-contacto" href="ciudad.html">Ciudad</a></li>
          <li><a class="link-body-contacto" href="lugares.html">Lugares</a></li>
          <li><a class="link-body-contacto" href="habitaciones.html">Habitaciones</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div>
        <form class="formulario">
          <h3 class="h3-contacto">Contactanos</h3>
          <p class="p-contacto">¿Tienes alguna pregunta? ¡Contáctanos!</p>
          <div>
            <a href="Tel: +54 299 555-0187" class="link-contacto"><strong>Llamanos!</strong></a>
          </div>
          <div>
            <a href="mailto: contacto@bahiaesmeralda.com.ar" class="link-contacto"><strong>Envíanos un correo!</strong></a>
          </div>
          <div class="formulario-box">
            <label for="nombre"><strong>Escribe tu nombre</strong></label>
          <input type="text" id="nombre" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label for="correo"><strong>Escribe tu correo</strong></label>
          <input type="email" id="correo" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label for="telefono"><strong>Escribe tu teléfono</strong></label>
          <input type="tel" id="telefono" class="box-input-contacto" />
          </div>
          <div class="formulario-box">
            <label class="label-formulario" for="mensaje"><strong>Escribe tu mensaje</strong></label>
          <textarea id="mensaje" cols="40" rows="5" class="mensaje"></textarea>
          <input type="submit" value="Enviar" class="submit-formulario" />
          </div>
        </form>
      </div>
    </main>
    <footer class="footer-contacto">
      <h2 class="h2-contacto">Nuestras Redes Sociales</h2>
      <a class="link-footer-contacto" href="https://www.esmeraldasocial.com/bahiaesmeralda" target="_blank"
        >Esmeralda Social</a
      >
    </footer>
  </body>
</html>
