<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva tu estadía</title>
</head>
<body>

    <section id="reserva" class="section">
        <h2>Reserva tu estadía</h2>

        <form class="form-reserva">
            <label>Fecha de entrada:</label>
            <input type="date" id="entrada">

            <label>Fecha de salida:</label>
            <input type="date" id="salida">

            <label>Tipo de habitación:</label>
            <select id="habitacion">
                <option value="90">Marea Clásica</option>
                <option value="140">Marea Vista al Mar</option>
                <option value="220">Suite Esmeralda</option>
            </select>

            <label>Cantidad de huéspedes:</label>
            <input type="number" id="huespedes" min="1" max="4">

            <button type="button" onclick="calcular()">Calcular precio</button>

            <p id="resultado"></p>
        </form>
    </section>

</body>
</html>
